name: Build

on:
  push:
    branches: [ main ]
    paths:
      - "vendor/proxmark3"
      - "Makefile.platform.*"
      - ".github/workflows/build.yml"

concurrency:
  group: pm3-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [pm3easy512, pm3easy256]
    steps:
      - name: Checkout wrapper repo (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM cross-toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make python3

      - name: Configure Makefile.platform
        run: cp Makefile.platform.${{ matrix.variant }} vendor/proxmark3/Makefile.platform

      - name: Build bootrom + fullimage
        working-directory: vendor/proxmark3
        run: |
          make clean
          make -j"$(nproc)" bootrom
          make -j"$(nproc)" fullimage

      - name: Convert ELF -> BIN
        working-directory: vendor/proxmark3
        run: |
          arm-none-eabi-objcopy -O binary bootrom/obj/bootrom.elf bootrom.bin
          arm-none-eabi-objcopy -O binary armsrc/obj/fullimage.elf fullimage.bin

      - name: Collect version info
        working-directory: vendor/proxmark3
        run: |
          {
            echo "variant=${{ matrix.variant }}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > ../${{ matrix.variant }}.meta

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: |
            vendor/proxmark3/bootrom.elf
            vendor/proxmark3/bootrom.bin
            vendor/proxmark3/armsrc/obj/fullimage.elf
            vendor/proxmark3/fullimage.bin
            ${{ matrix.variant }}.meta
          retention-days: 30